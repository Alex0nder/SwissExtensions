# Лендинг собирается из frontend/ (Vite + React + shadcn).
# Publish directory: frontend/apps/web/dist

[build]
  command = "cd frontend && npm ci && npm run build:web"
  publish = "frontend/apps/web/dist"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/downloads/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"
